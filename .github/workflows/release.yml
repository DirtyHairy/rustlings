name: Release

on:
  push:
    tags:
      - "*"

env:
  RELEASE_BODY: |
    Prebuilt release binaries are provided for MacOS (ARM and x64), Linux (ARM and x64) and Windows (ARM, x64 and x86).

    # MacOS

    MacOS binaries require at least Big Sur to run. The binaries carry an ad-hoc signature and are not notarized, so you'll have to ignore the scary warning, head over to the security preferences and confirm that you want to run rustlings anyway.

    # Linux

    Linux binaries should work on any distribution that ships libc 2.34 or newer.

    # Windows

    Windows binaries require at least Windows 10 to run.

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          target: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build
        run: cargo dist-macos

      - name: Package
        run: |
          for arch in arm64:aarch64-apple-darwin x86_64:x86_64-apple-darwin; do
            name="rustlings-${GITHUB_REF_NAME}-macos-${arch%%:*}"
            cp "target/${arch#*:}/release/rustlings" "$name"
            zip "$name.zip" "$name"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: "*.zip"
          if-no-files-found: error

  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target artifacts \
            --output type=local,dest=dist-out \
            -f Dockerfile.dist-linux \
            .

      - name: Package
        run: |
          name="rustlings-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mv dist-out/rustlings "$name"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: "*.tar.gz"
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.1
          target: i686-pc-windows-msvc,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Build
        run: cargo dist-windows

      - name: Package
        shell: bash
        run: |
          for arch in i686 x86_64 aarch64; do
            cp "target/${arch}-pc-windows-msvc/release/rustlings.exe" \
              "rustlings-${GITHUB_REF_NAME}-windows-${arch}.exe"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.exe"
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body: ${{ env.RELEASE_BODY }}
          files: dist/*
